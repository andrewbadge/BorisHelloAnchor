name: Feature request
description: Suggest a new capability or a change in behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not only the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Include any new configuration setting you have in mind.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
